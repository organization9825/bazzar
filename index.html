<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Bazaar | Local Community Marketplace</title>
    <meta name="description" content="Buy and sell locally on Bazaar — the fast, free community marketplace. Find furniture, electronics, clothing, vehicles and more near you." />
    <meta name="theme-color" content="#D4622A" />

    <!-- Security headers (enforced per-request by host; this is the meta fallback) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Google Fonts — preconnect before any CSS parse -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preconnect to Supabase so the first API call is faster -->
    <link rel="preconnect" href="https://sjbuenbmocnmlezanepq.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://sjbuenbmocnmlezanepq.supabase.co" />

    <!-- Open Graph (social sharing) -->
    <meta property="og:title" content="Bazaar | Local Community Marketplace" />
    <meta property="og:description" content="Buy and sell locally. Find great deals near you." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
